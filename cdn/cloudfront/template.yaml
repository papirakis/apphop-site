AWSTemplateFormatVersion: "2010-09-09"
Description: >
  apphop-site primary CDN: private S3 origin (OAC) + CloudFront. No WAF resources are defined here.
  Kept compatible with the CloudFront flat-rate Free plan (no real-time logs, no anycast IP list, OAC,
  cache/origin-request policies only); choosing the pricing plan is a separate console/API step after deploy.
  Deploy in us-east-1 (CloudFront + ACM). Origin bucket region is set by the bucket itself.

Parameters:
  SiteBucketName: { Type: String, Default: apphop-site-origin-usw2 }
  ReplicaBucketDomain:
    Type: String
    Default: ""
    Description: Optional regional domain of the us-east-1 replica bucket (origin failover). Empty = no origin group.
  Aliases:
    Type: CommaDelimitedList
    Default: ""
    Description: "www.apphop.app,apphop.app once DNS is approved. Empty = staging on *.cloudfront.net."
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: ACM cert (us-east-1) covering the aliases. Required when Aliases is set.
  LogBucketName: { Type: String, Default: apphop-site-cf-logs }

Conditions:
  HasAliases: !Not [!Equals [!Join ["", !Ref Aliases], ""]]
  HasReplica: !Not [!Equals [!Ref ReplicaBucketDomain, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SiteBucketName
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-old-versions, Status: Enabled, NoncurrentVersionExpiration: { NoncurrentDays: 7 } }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }

  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref LogBucketName
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerPreferred }] }   # legacy standard logs need ACLs
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      LifecycleConfiguration:
        Rules: [{ Id: expire-30d, Status: Enabled, ExpirationInDays: 30 }]

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: apphop-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/*"
            Condition: { StringEquals: { "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}" } }

  # Viewer-request function: apex -> www 301, and /path/ -> /path/index.html (S3 REST origins have no index docs).
  EdgeFn:
    Type: AWS::CloudFront::Function
    Properties:
      Name: apphop-site-viewer-request
      AutoPublish: true
      FunctionConfig: { Comment: "apex redirect + directory index", Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          var host = (r.headers.host && r.headers.host.value) || '';
          if (host === 'apphop.app') {
            var qs = Object.keys(r.querystring).map(function (k) { return k + '=' + r.querystring[k].value; }).join('&');
            return { statusCode: 301, statusDescription: 'Moved Permanently',
              headers: { location: { value: 'https://www.apphop.app' + r.uri + (qs ? '?' + qs : '') },
                         'strict-transport-security': { value: 'max-age=63072000; includeSubDomains' } } };
          }
          if (r.uri.endsWith('/')) { r.uri += 'index.html'; }
          else if (!r.uri.split('/').pop().includes('.')) {
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: r.uri + '/' } } };
          }
          return r;
        }

  HeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: apphop-site-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'"
        CustomHeadersConfig:
          Items:
            - { Header: x-served-by-cdn, Value: cloudfront, Override: true }   # parity/steering dashboards read this

  HtmlCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: apphop-site-html
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: apphop-site (primary CDN)
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        Aliases: !If [HasAliases, !Ref Aliases, !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasAliases
          - { AcmCertificateArn: !Ref AcmCertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - { CloudFrontDefaultCertificate: true }
        Logging: { Bucket: !GetAtt LogBucket.RegionalDomainName, Prefix: cf/, IncludeCookies: false }
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
        Origins:
          - Id: s3-primary
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - !If
            - HasReplica
            - { Id: s3-replica, DomainName: !Ref ReplicaBucketDomain, OriginAccessControlId: !GetAtt OAC.Id, S3OriginConfig: { OriginAccessIdentity: "" } }
            - !Ref "AWS::NoValue"
        OriginGroups: !If
          - HasReplica
          - Quantity: 1
            Items:
              - Id: s3-group
                FailoverCriteria: { StatusCodes: { Quantity: 3, Items: [500, 502, 503] } }
                Members: { Quantity: 2, Items: [{ OriginId: s3-primary }, { OriginId: s3-replica }] }
          - !Ref "AWS::NoValue"
        DefaultCacheBehavior:
          TargetOriginId: !If [HasReplica, s3-group, s3-primary]
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: !Ref HtmlCachePolicy
          ResponseHeadersPolicyId: !Ref HeadersPolicy
          FunctionAssociations: [{ EventType: viewer-request, FunctionARN: !GetAtt EdgeFn.FunctionMetadata.FunctionARN }]
        CacheBehaviors:
          - PathPattern: /_astro/*
            TargetOriginId: !If [HasReplica, s3-group, s3-primary]
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized (hashed, immutable assets)
            ResponseHeadersPolicyId: !Ref HeadersPolicy

Outputs:
  DistributionId: { Value: !Ref Distribution }
  DistributionDomain: { Value: !GetAtt Distribution.DomainName, Description: "CNAME target for www (steering target 'cloudfront')" }
  SiteBucket: { Value: !Ref SiteBucket }
  LogBucket: { Value: !Ref LogBucket }
