name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-links-lighthouse:
    name: Build, link check, Lighthouse CI (mobile budgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { BUILD_ID: "${{ github.sha }}" }
      - name: Link check (internal)
        run: npm run links
      - name: Lighthouse CI (mobile, simulated 4G, 3 runs)
        run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse-report, path: lhci-report, retention-days: 14 }

  playwright:
    name: Playwright — 8-viewport visual regression, mobile checks, axe
    runs-on: ubuntu-latest
    # Pinned container = identical fonts/rendering to the baselines (see update-baselines.yml).
    container: { image: "mcr.microsoft.com/playwright:v1.65.1-noble" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright test
        env: { HOME: /root }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "playwright-report\ntest-results", retention-days: 14 }
